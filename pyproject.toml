[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aftersale-agent"
version = "0.1.0"
description = "Evidence grounded after-sale workflows with bounded agents and durable approval"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph==1.0.3", "langgraph-checkpoint-sqlite==3.0.0",
  "fastapi==0.115.12", "pydantic==2.11.7", "uvicorn==0.34.3",
  "httpx==0.28.1", "jieba==0.42.1", "rank-bm25==0.2.2", "aiosqlite==0.21.0"
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.0"]

[tool.setuptools.packages.find]
include = ["aftersale*", "evaluation*"]

[tool.setuptools.package-data]
aftersale = ["static/*", "knowledge/*.md", "data/*.json"]
evaluation = ["cases.json", "ANNOTATION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
