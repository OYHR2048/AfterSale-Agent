<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfterSale-Agent · 售后任务台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div><span class="eyebrow">AFTERSALE / LOCAL DEMO</span><h1>售后异常处理任务台</h1><p>事实 → 证据 → 方案 → 确认 → 模拟申请</p></div><span id="mode" class="badge">读取模式…</span></header>
<main><aside><section><h2>开发身份</h2><p>从运行目录 auth.json 读取 alice 凭据。身份由服务端确定。</p><input id="token" type="password" placeholder="粘贴开发凭据" autocomplete="off"><button id="login">登录</button><p id="identity">尚未登录</p></section><section><h2>模拟订单</h2><div id="orders"></div></section><section><h2>已保存任务</h2><button id="reload">刷新任务</button><div id="tasks"></div></section></aside>
<div class="workspace"><section><div class="row"><h2>任务对话</h2><select id="architecture"><option value="multi">三个角色协作</option><option value="single">单 Agent 对照</option></select></div><p class="muted">虚构政策和本地模拟订单；申请受理不代表退款到账。</p><div class="samples"><button data-sample="ORD10002 定制杯质量问题，照片显示破损，已经超过七天。优先换货，缺库存再退款。">定制质量问题</button><button data-sample="ORD10004 质量问题，照片显示错字，想换货">缺库存</button><button data-sample="ORD10006 物流停滞，请转人工工单">物流异常</button></div><div id="conversation" aria-live="polite"></div><textarea id="message" rows="3" placeholder="输入订单和售后目标，或补充缺失信息"></textarea><div class="row"><button id="new">开始新任务</button><button id="send" disabled>补充 / 修改当前任务</button></div><p id="error" role="alert"></p></section>
<section id="statepanel"><div class="row"><h2>状态与处理方案</h2><span id="status" class="badge">未开始</span></div><p id="taskid" class="muted"></p><div id="question"></div><div id="proposal"></div><div class="row"><button id="confirm" disabled>确认此版本并提交模拟申请</button><button id="reject" class="secondary" disabled>拒绝 / 撤销</button><button id="recover" disabled>恢复此任务</button></div><pre id="result"></pre><details><summary>政策证据与版本</summary><div id="citations"></div></details></section>
<section><div class="row"><h2>事件时间线</h2><span id="budget" class="muted"></span></div><p class="muted">展示真实委派和工具步骤；演示决策为规则替身，不显示模型思维链。</p><div id="timeline"></div></section></div></main><script src="/static/app.js"></script></body></html>
